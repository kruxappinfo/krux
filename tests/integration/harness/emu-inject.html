<style>#landing-page,.mobile-onboarding,.mobile-login-modal{display:none!important}.bottom-nav{display:flex!important}</style>
<script>
window.addEventListener('error', e => { console.log('ERR', e.message); });
(async function () {
  const q = new URLSearchParams(location.search);
  const state = q.get('state');
  const w = ms => new Promise(r => setTimeout(r, ms));
  const $ = id => document.getElementById(id);
  const R = {};
  const done = () => { const top = window.top || window; try { top.document.title = 'T|' + JSON.stringify(R); } catch (_) { document.title = 'T|' + JSON.stringify(R); } };
  const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r('__TIMEOUT__'), ms))]);
  await w(3500);





  if (state === 'racepage') {
    try {
      const email = q.get('email'); const at = parseInt(q.get('at'), 10);
      while (Date.now() < at) await w(5);
      const t0 = Date.now();
      await firebase.auth().signInWithEmailAndPassword(email, 'password123');
      await w(5000);
      R.plans = (window.kruxPlans || []).map(p => p.id).join();
      R.active = window.kruxPlanState && window.kruxPlanState.activePlanId;
      R.notice = window.kruxPlanNotice ? window.kruxPlanNotice.type : null;
      R.msSignIn = Date.now() - t0;
    } catch (er) { R.err = er.message; }
    done(); return;
  }
  if (state === 'multi-dbg') {
    try {
      R.rows = [];
      for (let i = 0; i < 10; i++) {
        const e = 'd' + Date.now() + i + '@t.dev'; const c = await firebase.auth().createUserWithEmailAndPassword(e, 'password123'); await w(1200);
        await firebase.auth().signOut(); await w(300); await firebase.auth().signInWithEmailAndPassword(e, 'password123'); await w(1500);
        const t0 = Date.now();
        let r; try { const sn = await db.collection('users').doc(c.user.uid).collection('training_plans').get(); r = sn.size + (sn.metadata.fromCache ? 'C' : ''); } catch (er) { r = 'ERR'; }
        R.rows.push(i + ':' + r + ':' + (Date.now() - t0) + 'ms');
        document.title = 'P|' + R.rows.join(' ');
      }
    } catch (er) { R.err = er.message; }
    done(); return;
  }
  if (state === 'racepage') {
    try {
      const email = q.get('email'); const at = parseInt(q.get('at'), 10);
      while (Date.now() < at) await w(5);
      const t0 = Date.now();
      await firebase.auth().signInWithEmailAndPassword(email, 'password123');
      await w(5000);
      R.plans = (window.kruxPlans || []).map(p => p.id).join();
      R.active = window.kruxPlanState && window.kruxPlanState.activePlanId;
      R.notice = window.kruxPlanNotice ? window.kruxPlanNotice.type : null;
      R.msSignIn = Date.now() - t0;
    } catch (er) { R.err = er.message; }
    done(); return;
  }
  if (state === 'multi-dbg') {
    try {
      const ST = KruxTrainStore.plans;
      const e = 'd' + Date.now() + '@t.dev'; const c = await firebase.auth().createUserWithEmailAndPassword(e, 'password123'); await w(1500);
      const t0 = Date.now();
      R.nothing = await ST.migrate().catch(x => 'ERR:' + x.code + ':' + x.message); R.ms1 = Date.now() - t0;
      const t1 = Date.now();
      R.nothing2 = await ST.migrate().catch(x => 'ERR:' + x.code); R.ms2 = Date.now() - t1;
      R.reload = JSON.stringify(await ST.reload().then(x => x).catch(x => 'ERR' + x.message)); 
    } catch (er) { R.err = er.message; }
    done(); return;
  }
  if (state === 'racepage') {
    try {
      const email = q.get('email'); const at = parseInt(q.get('at'), 10);
      while (Date.now() < at) await w(5);
      const t0 = Date.now();
      await firebase.auth().signInWithEmailAndPassword(email, 'password123');
      await w(5000);
      R.plans = (window.kruxPlans || []).map(p => p.id).join();
      R.active = window.kruxPlanState && window.kruxPlanState.activePlanId;
      R.notice = window.kruxPlanNotice ? window.kruxPlanNotice.type : null;
      R.msSignIn = Date.now() - t0;
    } catch (er) { R.err = er.message; }
    done(); return;
  }
  if (state === 'multi-dbg') {
    try {
      const ST = KruxTrainStore.plans; const FV = firebase.firestore.FieldValue;
      const e = 'd' + Date.now() + '@t.dev'; const c = await firebase.auth().createUserWithEmailAndPassword(e, 'password123'); await w(1500);
      const ud = db.collection('users').doc(c.user.uid);
      await ud.collection('training_plan').doc('active').set({ name: 'L', weeks: 4, activeDays: [true,false,false,false,false,false,false], sessions: [], updatedAt: FV.serverTimestamp() });
      const cyc = async () => { await firebase.auth().signOut(); await w(300); await firebase.auth().signInWithEmailAndPassword(e, 'password123'); await w(2200); };
      const count = async () => { try { const s = await ud.collection('training_plans').get(); return s.size + (s.metadata.fromCache ? '(caché)' : ''); } catch (er) { return 'ERR ' + er.message.slice(0, 40); } };
      const upto = parseInt(q.get('upto') || '9', 10);
      await cyc(); R.c1 = await count(); if (upto < 2) { done(); return; }
      const many = await Promise.all([1, 2, 3, 4, 5].map(() => ST.migrate().catch(x => 'ERR:' + x.code))); R.many = many.join();
      R.trasMigrar = await count(); if (upto < 3) { done(); return; }
      await cyc(); R.c2 = await count(); if (upto < 4) { done(); return; }
      await cyc(); R.c3 = await count();
    } catch (er) { R.err = er.message; }
    done(); return;
  }


  if (state.startsWith('off')) {
    const T = {}; const note = (k, ok, extra) => { T[k] = !!ok; if (!ok || extra) R[k] = extra === undefined ? 'FALLA' : extra; document.title = 'P|' + Object.keys(T).length + '|' + k; };
    const fin = () => { R.fallos = Object.entries(T).filter(([k, v]) => !v).map(([k]) => k); R.resumen = Object.values(T).filter(Boolean).length + '/' + Object.keys(T).length; done(); };
    try {
      const ST = KruxTrainStore; const FV = firebase.firestore.FieldValue;
      const act = async (id, ms) => { const el = $(id); if (el && !el.disabled && el.offsetParent !== null) { el.click(); await w(ms || 250); return true; } return false; };
      const runSession = async (feel) => {
        window.__s = 1; openActiveSession(); await w(700);
        for (let i = 0; i < 12; i++) { if (await act('session-btn-set', 300)) { document.querySelector('#session-rpe-dots [data-rpe="7"]')?.click(); await w(150); continue; } if (await act('session-btn-main', 400)) continue; break; }
        await act('session-finish-btn', 300); await act('confirm-ok', 400);
        document.querySelector('[data-feel="' + (feel || 'ok') + '"]')?.click(); document.querySelector('#plog-rpe-row [data-rpe="6"]')?.click(); await w(100);
        $('plog-save-btn')?.click(); await w(1500);
        const hint = $('plog-done-hint') ? $('plog-done-hint').textContent : '';
        $('plog-close-done')?.click(); await w(400);
        return hint;
      };
      const goOffline = async () => { await db.disableNetwork(); Object.defineProperty(navigator, 'onLine', { get: () => false, configurable: true }); window.dispatchEvent(new Event('offline')); };
      const goOnline = async () => { await db.enableNetwork(); Object.defineProperty(navigator, 'onLine', { get: () => true, configurable: true }); window.dispatchEvent(new Event('online')); };
      const today = ['D', 'L', 'M', 'X', 'J', 'V', 'S'][new Date().getDay()];
      const ex = (name, o) => Object.assign({ name, sets: 2, workSec: 0, reps: 5, weight: 0, restSec: 0, rpeTarget: 6 }, o || {});
      const lsKeys = () => Object.keys(localStorage).filter(k => k.startsWith('krux.train.v1.'));
      const qlen = () => ST.sync.info().pending;
      const uidNow = () => firebase.auth().currentUser && firebase.auth().currentUser.uid;

      if (state === 'off1') {          // ── conexión: preparar cuenta y plan, luego quedarse sin red
        const e = 'off' + Date.now() + '@t.dev'; localStorage.setItem('t.email', e);
        const c = await firebase.auth().createUserWithEmailAndPassword(e, 'password123'); await w(1800);
        const idA = await ST.plans.create({ name: 'Plan sin red', weeks: 4, activeDays: [true, true, true, true, true, true, true], sessions: ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => ({ day: d, name: 'Sesión ' + d, exercises: [ex('Plancha', { workSec: 0, reps: 5 })] })) }, { activate: true });
        await w(500);
        note('o1_cacheEscrita', lsKeys().some(k => k.includes('.cache.' + c.user.uid)) && JSON.parse(localStorage.getItem(lsKeys().find(k => k.includes('.cache.')))).plan.name === 'Plan sin red');
        switchView('train-view'); await w(500);
        await goOffline();
        const hint = await runSession('great');
        note('o1_mensajePendiente', hint === 'Guardada en este dispositivo. Se sincronizará cuando haya conexión.', hint);
        const info = ST.sync.info();
        note('o1_enCola', info.pending === 1 && info.conflicts === 0 && info.offline === true);
        note('o1_colaPersistente', lsKeys().some(k => k.includes('.pending.')) && JSON.parse(localStorage.getItem(lsKeys().find(k => k.includes('.pending.')))).length === 1);
        const rec = window.kruxTrainLog.find(r => r.pendingId);
        note('o1_cuentaEnElCalendario', !!rec && rec.dateKey === trDateKey(new Date()) && document.querySelector('.train-day.is-today.is-done') !== null, rec ? '' : 'sin registro');
        note('o1_avisoVisible', !$('train-sync').classList.contains('hidden') && $('train-sync').textContent.includes('1 sesión pendiente'), $('train-sync').textContent.slice(0, 80));
        note('o1_botonSincronizarDeshabilitado', $('train-sync').querySelector('[data-sync="flush"]').disabled === true);
        // intento de cambiar de plan sin red: error claro, nada se pierde
        note('o1_noEditaPlanesSinRed', (await ST.plans.setStatus(idA, 'trash')) === false && window.kruxPlanState.activePlanId === idA && window.kruxActivePlan && window.kruxActivePlan.id === idA);
        R.nota = 'sesión guardada solo en el dispositivo';
      }
      if (state === 'off2') {          // ── reinicio de la app SIN conexión
        note('o2_hayUsuario', !!uidNow() || (await new Promise(r => setTimeout(() => r(!!uidNow()), 1500))));
        await w(1500);
        note('o2_planDesdeCopia', window.kruxActivePlan && window.kruxActivePlan.name === 'Plan sin red' && window.kruxPlanNotice && window.kruxPlanNotice.type === 'offline', JSON.stringify(window.kruxPlanNotice));
        note('o2_pendienteSigueAhi', ST.sync.info().pending === 1 && window.kruxTrainLog.some(r => r.pendingId));
        note('o2_avisoSinConexion', !$('train-sync').classList.contains('hidden'));
        switchView('train-view'); await w(400);
        note('o2_calendarioConLoPendiente', document.querySelector('.train-day.is-today.is-done') !== null);
        const hint = await runSession('ok');
        note('o2_segundaSesionEnCola', ST.sync.info().pending === 2 && hint.startsWith('Guardada en este dispositivo'), hint);
        R.ids = ST.sync.info().entries.map(e => e.id).join();
      }
      if (state === 'off3') {          // ── vuelve la conexión: se sincroniza sin duplicar
        for (let i = 0; i < 30 && !uidNow(); i++) await w(300);
        for (let i = 0; i < 40 && ST.sync.info().pending > 0; i++) await w(500);
        const db1 = db.collection('users').doc(uidNow()).collection('training_sessions');
        const snap = await db1.get({ source: 'server' });
        note('o3_colaVacia', ST.sync.info().pending === 0 && !lsKeys().some(k => k.includes('.pending.')));
        note('o3_dosSesionesEnElServidor', snap.size === 2, snap.size);
        const ids = snap.docs.map(d => d.id);
        const d0 = snap.docs[0].data();
        note('o3_datosCompletos', snap.docs.every(d => d.data().exercises.length === 1 && d.data().exercises[0].sets.length === 2 && d.data().feel && d.data().rpe === 6 && d.data().planId), JSON.stringify(Object.keys(d0)));
        await Promise.all([ST.sync.flush(), ST.sync.flush(), ST.sync.flush()]);
        note('o3_reintentosNoDuplican', (await db1.get({ source: 'server' })).size === 2);
        note('o3_registrosConId', window.kruxTrainLog.filter(r => !r.demo).every(r => !r.pendingId) && ids.every(id => window.kruxTrainLog.some(r => r.id === id)), window.kruxTrainLog.map(r => r.id || ('pend:' + r.pendingId)).join());
        note('o3_avisoOculto', $('train-sync').classList.contains('hidden'));
        note('o3_caches', lsKeys().some(k => k.includes('.cache.')));
        note('o3_planSigueActivo', !!window.kruxActivePlan && window.kruxPlanState.activePlanId === window.kruxActivePlan.id && window.kruxActivePlan.status === 'ready');
        R.syncedIds = ids.length;
      }
      if (state === 'off4') {          // ── conflicto del servidor + aislamiento entre cuentas
        const email = localStorage.getItem('t.email');
        for (let i = 0; i < 60 && !(uidNow() && window.kruxActivePlan && window.kruxTrainData && !window.kruxTrainData.demo && window.kruxTrainData.exercises.length); i++) await w(300);
        R.pre = JSON.stringify({ notice: window.kruxPlanNotice, plans: (window.kruxPlans || []).length, st: window.kruxPlanState, uid: !!uidNow(), plan: !!window.kruxActivePlan, td: window.kruxTrainData && window.kruxTrainData.name, demo: window.kruxTrainData && window.kruxTrainData.demo });
        switchView('train-view'); await w(500);
        const uidA = uidNow();
        await goOffline();
        const hint = await runSession('bad');
        R.hint = hint; R.queue = JSON.stringify(ST.sync.info()).slice(0, 200); R.tdata = (window.kruxTrainData && window.kruxTrainData.name) + '|' + (window.kruxTrainData && window.kruxTrainData.exercises.length);
        await goOnline();
        R.t0 = Date.now(); R.afterOnline = JSON.stringify(ST.sync.info().entries.map(e => [e.state, e.lastError]));
        { const q = JSON.parse(localStorage.getItem(lsKeys().find(k => k.includes('.pending.'))) || '[]'); R.qAttempts = q.map(e => e.attempts); }
        await w(3000); R.after3s = JSON.stringify(ST.sync.info().entries.map(e => [e.state, e.lastError])) + '|onLine=' + navigator.onLine;
        const fl = await Promise.race([ST.sync.flush().then(() => 'flush-ok'), new Promise(r => setTimeout(() => r('flush-cuelga'), 12000))]); R.flushRes = fl;
        R.afterFlush = JSON.stringify(ST.sync.info().entries.map(e => [e.state, e.lastError]));
        // el servidor rechaza la escritura (las reglas de prueba deniegan crear sesiones)
        for (let i = 0; i < 200 && ST.sync.info().conflicts === 0; i++) await w(500);
        const info = ST.sync.info();
        note('o4_conflicto', info.conflicts === 1 && info.pending === 0, JSON.stringify([info.pending, info.conflicts]));
        note('o4_avisoConflicto', $('train-sync').classList.contains('is-error') && $('train-sync').textContent.includes('no se ha podido sincronizar'), $('train-sync').textContent.slice(0, 90));
        note('o4_noSeReintentaSolo', (await (async () => { await ST.sync.flush(); return true; })()) && ST.sync.info().conflicts === 1);
        note('o4_sigueGuardada', lsKeys().some(k => k.includes('.pending.' + uidA)));
        // otra cuenta en el mismo dispositivo: no ve ni sincroniza nada de A
        await firebase.auth().signOut(); await w(500);
        note('o4_cierreBorraCopia', !lsKeys().some(k => k.includes('.cache.' + uidA)) && lsKeys().some(k => k.includes('.pending.' + uidA)));
        const e2 = 'offB' + Date.now() + '@t.dev';
        const cb = await firebase.auth().createUserWithEmailAndPassword(e2, 'password123'); await w(2500);
        note('o4_otraCuentaNoVeNada', ST.sync.info().pending === 0 && ST.sync.info().conflicts === 0 && !window.kruxTrainLog.some(r => r.pendingId) && window.kruxActivePlan === null);
        await ST.sync.flush(); await w(500);
        note('o4_otraCuentaNoSincroniza', !(await db.collection('users').doc(cb.user.uid).collection('training_sessions').get()).size);
        // vuelve A: lo suyo sigue ahí; con las reglas restauradas, reintentar lo sincroniza
        await firebase.auth().signOut(); await w(300);
        await firebase.auth().signInWithEmailAndPassword(email, 'password123'); await w(2500);
        note('o4_vuelveAyLoSuyoSigue', ST.sync.info().conflicts === 1 && window.kruxTrainLog.some(r => r.pendingId));
        R.uidA = uidA;
      }

      if (state === 'off6') {          // ── fallos de red alrededor de una acción sobre un plan
        const e = 'off6' + Date.now() + '@t.dev'; await firebase.auth().createUserWithEmailAndPassword(e, 'password123'); await w(1800);
        const mkp = name => ST.plans.create({ name, weeks: 4, activeDays: [true, true, true, true, true, true, true], sessions: [{ day: today, name: 'S', exercises: [ex('Plancha')] }] }, { activate: false });
        const idA = await mkp('Plan A'), idB = await mkp('Plan B');
        const server = async id => (await db.collection('users').doc(uidNow()).collection('training_plans').doc(id).get({ source: 'server' })).data();
        // 1) sin conexión conocida: responde al instante y no hace nada
        await goOffline();
        const t = Date.now();
        note('o6_sinRedRespondeAlMomento', (await ST.plans.activate(idA)) === false && Date.now() - t < 1500);
        await goOnline(); await w(1500);
        const st0 = (await db.collection('users').doc(uidNow()).collection('training_state').doc('current').get({ source: 'server' })).data();
        note('o6_sinRedNoAplicaNada', st0.activePlanId === null || st0.activePlanId === undefined, JSON.stringify(st0.activePlanId));
        // 2) la escritura SÍ se confirma y justo después falla la lectura: no se informa de un error que no hubo
        const realGet = db.collection('users').doc(uidNow()).collection('training_plans').get.bind(db.collection('users').doc(uidNow()).collection('training_plans'));
        const origRefresh = ST.plans.reload;
        let block = true;
        const proto = Object.getPrototypeOf(db.collection('users').doc(uidNow()).collection('training_plans'));
        const origGet = proto.get;
        proto.get = function (...a) { if (block && /training_plans$/.test(this.path || '')) return Promise.reject(Object.assign(new Error('Failed to get documents because the client is offline'), { code: 'unavailable' })); return origGet.apply(this, a); };
        const ok = await ST.plans.activate(idB);
        block = false; proto.get = origGet;
        note('o6_escrituraConfirmadaNoEsError', ok === true, ok);
        note('o6_seAplicoEnElServidor', (await db.collection('users').doc(uidNow()).collection('training_state').doc('current').get({ source: 'server' })).data().activePlanId === idB);
        note('o6_vistaEnMemoriaActualizada', window.kruxPlanState.activePlanId === idB && window.kruxActivePlan && window.kruxActivePlan.id === idB);
        block = true; proto.get = function (...a) { if (block && /training_plans$/.test(this.path || '')) return Promise.reject(Object.assign(new Error('offline'), { code: 'unavailable' })); return origGet.apply(this, a); };
        const ok2 = await ST.plans.setStatus(idA, 'trash');
        block = false; proto.get = origGet;
        note('o6_papeleraConfirmadaTambien', ok2 === true && (await server(idA)).status === 'trashed' && window.kruxPlans.find(p => p.id === idA).status === 'trashed');
      }
      if (state === 'off5') {          // ── reintentar el conflicto con las reglas restauradas; descartar
        for (let i = 0; i < 60 && !(uidNow() && window.kruxActivePlan && window.kruxTrainData && !window.kruxTrainData.demo && window.kruxTrainData.exercises.length); i++) await w(300);
        switchView('train-view'); await w(1500);
        note('o5_conflictoPersiste', ST.sync.info().conflicts === 1);
        await ST.sync.retryConflicts(); await w(1500);
        { const inf = ST.sync.info(); const n = (await db.collection('users').doc(uidNow()).collection('training_sessions').get({ source: 'server' })).size;
          note('o5_reintentoSincroniza', inf.conflicts === 0 && inf.pending === 0 && n === 3, JSON.stringify({ p: inf.pending, c: inf.conflicts, n, e: inf.entries.map(x => x.state + ':' + x.lastError) })); }
        // cuota de almacenamiento: si el dispositivo no puede guardar, se avisa y sigue funcionando en memoria
        const orig = Storage.prototype.setItem; Storage.prototype.setItem = function () { throw new DOMException('quota', 'QuotaExceededError'); };
        await goOffline();
        const hint = await runSession('ok');
        const toast = [...document.querySelectorAll('#toast-container *')].map(n => n.textContent).join(' ');
        note('o5_cuotaAvisa', toast.includes('No hay espacio'), toast.slice(0, 100));
        note('o5_cuotaSigueEnMemoria', ST.sync.info().pending === 1, JSON.stringify([ST.sync.info(), hint]).slice(0, 300));
        Storage.prototype.setItem = orig;
        await goOnline(); for (let i = 0; i < 20 && ST.sync.info().pending > 0; i++) await w(500);
        note('o5_cuotaSincronizaAlVolver', ST.sync.info().pending === 0 && (await db.collection('users').doc(uidNow()).collection('training_sessions').get({ source: 'server' })).size === 4);
      }
    } catch (er) { R.err = er.message + ' ' + (er.stack || '').split('\n')[1]; }
    fin(); return;
  }
  if (state === 'coach') {      // ── perfil del escalador, onboarding y evaluación mental (Fase 1)
    const T = {}; const note = (k, ok, extra) => { T[k] = !!ok; if (!ok || extra) R[k] = extra === undefined ? 'FALLA' : extra; document.title = 'P|' + Object.keys(T).length + '|' + k; };
    try {
      const FV = firebase.firestore.FieldValue;
      const C = window.KruxCoach; const P = window.KruxProfile;
      const mkUser = async prefix => { const e = prefix + Date.now() + Math.floor(Math.random() * 999) + '@t.dev'; const c = await firebase.auth().createUserWithEmailAndPassword(e, 'password123'); return { email: e, uid: c.user.uid }; };
      const waitFor = async (fn, ms) => { for (let i = 0; i < (ms || 40); i++) { try { if (fn()) return true; } catch (_) { /* aún no */ } await w(150); } return false; };
      const ud = u => db.collection('users').doc(u.uid);
      const pdoc = async u => (await ud(u).collection('training_profile').doc('current').get({ source: 'server' }));
      const mdoc = async u => (await ud(u).collection('mental_profile').doc('current').get({ source: 'server' }));
      const click = async (sel, ms) => { const el = typeof sel === 'string' ? document.querySelector(sel) : sel; if (!el) throw new Error('no existe ' + sel); el.click(); await w(ms || 350); };
      const pick = async (sel, value) => { const el = document.querySelector(sel); if (!el) throw new Error('no existe ' + sel); el.value = value; el.dispatchEvent(new Event('change', { bubbles: true })); await w(120); };
      const modal = () => document.getElementById('coach-modal');
      const title = () => (document.getElementById('cx-title') || {}).textContent || '';
      const nextDisabled = () => document.getElementById('cx-next').disabled;
      const navigate = () => { try { switchView('train-view'); } catch (_) { /* ya abierta */ } };
      const shot = async name => { if (!q.get('shots')) return; const top = window.top || window; top.document.title = 'S|' + name; await w(900); };

      if (!window.KRUX_COACH) {      // ── con el interruptor apagado no se ve nada
        const u0 = await mkUser('off'); await w(2500);
        navigate(); await w(500);
        note('c0_flagApagado', window.KRUX_COACH === false && C.enabled() === false);

        R.signedOutToast = [...document.querySelectorAll('#toast-container *')].map(n => n.textContent).join(' ').slice(0, 80);
      }
      if (state === 'offline') {
        await db.disableNetwork();
        const t0 = Date.now();
        heart.click();
        await w(5000);
        R.favOfflineAfter5s = heart.getAttribute('aria-pressed') + '|' + document.querySelector('#toast-container')?.textContent.slice(0, 60);
        // guardar un plan sin red
        window.openPlanEditor(); await w(700);
        const btn = $('pe-save-top'); btn.click(); await w(6000);
        R.saveOfflineAfter6s = btn.textContent.trim() + '|disabled=' + btn.disabled + '|pantallaGuardado=' + !!document.querySelector('.pe-saved-title');
        await w(11000);
        R.toastTxt = [...document.querySelectorAll('#toast-container *')].map(n => n.textContent).join(' ').slice(0, 120);
        R.saveOfflineAfter17s = btn.textContent.trim() + '|disabled=' + btn.disabled + '|pantallaGuardado=' + !!document.querySelector('.pe-saved-title');
        await db.enableNetwork(); await w(2500);
        R.afterReconnect = (await favDocs()) + '|' + !!document.querySelector('.pe-saved-title') + '|planDoc=' + (await db.collection('users').doc(uid).collection('training_plan').doc('active').get()).exists;
      }
      if (state === 'denied') {
        heart.click(); await w(1500);
        R.favDenied = heart.getAttribute('aria-pressed') + '|' + (await favDocs()) + '|' + [...document.querySelectorAll('#toast-container *')].map(n => n.textContent).join(' ').slice(0, 120);
        window.openPlanEditor(); await w(700);
        const btn = $('pe-save-top'); btn.click(); await w(2000);
        R.saveDenied = btn.textContent.trim() + '|disabled=' + btn.disabled + '|pantallaGuardado=' + !!document.querySelector('.pe-saved-title') + '|' + [...document.querySelectorAll('#toast-container *')].map(n => n.textContent).join(' ').slice(0, 140);
        btn.click(); await w(1500);
        R.retryOk = btn.textContent.trim();
        // «añadir a mi plan» desde la ficha con el plan en memoria
        window.kruxActivePlan = { name: 'P', weeks: 4, activeDays: [true, false, true, false, false, false, false], sessions: [{ day: 'L', name: 'S1', exercises: [] }] };
        L.open({ mode: 'browse' }); await w(900);
        document.querySelector('[data-open=plancha]').click(); await w(500); $('xl-add-plan').click(); await w(400);
        document.querySelector('[data-sess="0"]').click(); await w(1500);
        R.addDenied = window.kruxActivePlan.sessions[0].exercises.length + '|' + [...document.querySelectorAll('#toast-container *')].map(n => n.textContent).join(' ').slice(0, 100);
      }
    } catch (e) { R.err = e.message + ' ' + (e.stack || '').split('\n')[1]; }
    done(); return;
  }

  if (state === 'remote') {
    try {
      const mk = async (e) => (await firebase.auth().createUserWithEmailAndPassword(e, 'password123')).user;
      // La librería se abre primero sin sesión: no debe quedarse marcada como cargada
      await firebase.auth().signOut(); await w(500);
      window.KruxLibrary.open({ mode: 'browse' }); await w(800);
      R.antes = window.KruxLibrary.catalog().exercises.length;
      window.KruxLibrary.close(); await w(400);
      // super-admin (solo en el emulador) publica fichas
      await firebase.auth().signInWithEmailAndPassword('krux.app.info@gmail.com', 'password123').catch(() => firebase.auth().createUserWithEmailAndPassword('krux.app.info@gmail.com', 'password123')); await w(800);
      const base = JSON.parse(JSON.stringify(window.KRUX_CATALOG_DATA.exercises.find(e => e.id === 'plancha')));
      const nueva = Object.assign({}, base, { id: 'plancha-lateral', slug: 'plancha-lateral', name: 'Plancha lateral', aliases: ['side plank'], contentVersion: 1 });
      const actualizada = Object.assign({}, base, { name: 'Plancha (versión 2)', contentVersion: 2 });
      const vieja = Object.assign({}, base, { id: 'hollow-body', slug: 'hollow-body', name: 'NO DEBE APARECER', contentVersion: 1 });
      const invalida = Object.assign({}, base, { id: 'ficha-rota', slug: 'ficha-rota', name: 'Ficha rota', relations: Object.assign({}, base.relations, { alternatives: [{ exerciseId: 'no-existe', reason: 'x', order: 1 }] }) });
      const borrador = Object.assign({}, base, { id: 'borrador-x', slug: 'borrador-x', name: 'Borrador', status: 'draft' });
      for (const f of [nueva, actualizada, vieja, invalida, borrador]) await db.collection('exercises').doc(f.id).set(f);
      await firebase.auth().signOut(); await w(300);
      await mk('u' + Date.now() + '@t.dev'); await w(800);
      window.KruxLibrary.open({ mode: 'browse' }); await w(2500);
      const cat = window.KruxLibrary.catalog();
      R.despues = cat.exercises.length;
      R.nueva = !!cat.byId.get('plancha-lateral');
      R.actualizada = cat.byId.get('plancha').name;
      R.viejaIgnorada = cat.byId.get('hollow-body').name;
      R.invalidaRechazada = !cat.byId.get('ficha-rota');
      R.borradorOculto = !cat.byId.get('borrador-x');
      $('xl-search').value = 'side plank'; $('xl-search').dispatchEvent(new Event('input')); await w(400);
      R.busqueda = [...document.querySelectorAll('.xl-card-name')].map(n => n.textContent).join(',');
    } catch (e) { R.err = e.message + ' ' + (e.stack || '').split('\n')[1]; }
    done(); return;
  }
  try {
    const email = 'p' + Date.now() + Math.floor(Math.random() * 1000) + '@t.dev';
    const cred = await firebase.auth().createUserWithEmailAndPassword(email, 'password123');
    const uid = cred.user.uid;
    const userDoc = () => db.collection('users').doc(uid);
    const signCycle = async () => { await firebase.auth().signOut(); await w(300); await firebase.auth().signInWithEmailAndPassword(email, 'password123'); await w(1800); };
    await w(1500);
    R.emptyLoad = window.kruxActivePlan === null || window.kruxActivePlan === undefined;

    const legacyEx = (name, o) => Object.assign({ name, sets: 3, workSec: 0, reps: 8, weight: 0, restSec: 120, rpeTarget: 7 }, o || {});
    const legacy = {
      name: 'Plan antiguo', weeks: 6, goal: 'fuerza', level: 2, equipment: ['barra'], activeDays: [true, false, true, true, true, false, false],
      sessions: [
        { day: 'L', name: 'Fuerza dedos', exercises: [legacyEx('Max hang · 20mm', { sets: 4, workSec: 10, reps: 0, weight: 20, restSec: 180, rpeTarget: 8 }), legacyEx('Campus board · 1-5-9', { reps: 5 }), legacyEx('Pullover isométrico con un nombre bastante largo', { workSec: 7, reps: 0 }), legacyEx('Manguito rotador', { sets: 2, reps: 15, restSec: 60, rpeTarget: 0 }), legacyEx('Ejercicio inventado por mí', { sets: 5 })] },
        { day: 'X', name: 'Potencia', exercises: [legacyEx('Dynos a dedo', { sets: 5, reps: 3, restSec: 180, rpeTarget: 8 })] },
        { day: 'J', name: 'Resistencia', exercises: [legacyEx('ARC · panel 45°', { sets: 2, workSec: 1200, reps: 0, restSec: 300, rpeTarget: 6 }), legacyEx('4×4 bloque', { sets: 4, reps: 4, restSec: 240 })] },
        { day: 'V', name: 'Piernas', exercises: [] }
      ]
    };
    await userDoc().collection('training_plan').doc('active').set(Object.assign({}, legacy, { updatedAt: firebase.firestore.FieldValue.serverTimestamp() }));
    const today = new Date(); const key = d => trDateKey(new Date(today.getTime() - d * 86400000));
    const legacySess = (d, n) => ({ dateKey: key(d), sessionName: n, startedAt: Date.now() - d * 86400000, durationSec: 900, exercises: [{ name: 'Max hang · 20mm', target: { name: 'Max hang · 20mm', sets: 4, workSec: 10, reps: 0, weight: 20, restSec: 180, rpeTarget: 8 }, sets: [{ n: 1, workSec: 10, reps: 0, weight: 20, rpe: 8, time: '10:01' }] }], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    await userDoc().collection('training_sessions').doc('old1').set(legacySess(3, 'Fuerza antigua'));
    await userDoc().collection('training_sessions').doc('old2').set(legacySess(10, 'Otra antigua'));
    await signCycle();

    // ── Lectura del plan antiguo
    const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    const p = window.kruxActivePlan;
    R.loadedPlan = !!p && p.name === legacy.name && p.weeks === legacy.weeks && same(p.activeDays, legacy.activeDays) && same(p.sessions, legacy.sessions) && p.goal === 'fuerza';
    R.logLen = (window.kruxTrainLog || []).length;
    switchView('train-view'); await w(600);
    R.hero = $('train-hero-title').textContent + '|' + $('train-hero-sub').textContent;
    R.todaySession = $('train-session-name').textContent + '|' + $('train-session-meta').textContent;

    // ── Ejecutar una sesión antigua (jueves → «Resistencia»)
    const histBefore = await userDoc().collection('training_sessions').get().then(s => s.docs.map(d => [d.id, JSON.stringify(d.data(), (k, v) => (v && v.seconds !== undefined ? 'TS' : v))]).sort());
    window.__s = 1; openActiveSession(); await w(700);
    R.sessionOpen = $('session-ex-name').textContent;
    const act = async (id, ms) => { const el = $(id); if (el && !el.disabled && el.offsetParent !== null) { el.click(); await w(ms || 250); return true; } return false; };
    const trace = [];
    for (let i = 0; i < 30; i++) {
      const mode = document.getElementById('session-screen')?.dataset.mode || '';
      if (await act('session-btn-set', 300)) { document.querySelector('#session-rpe-dots [data-rpe="8"]')?.click(); await w(200); trace.push('set'); continue; }
      if (await act('session-btn-main', 400)) { trace.push('main:' + ($('session-btn-label')?.textContent || '')); if (trace.filter(t => t.startsWith('main')).length > 8) break; continue; }
      break;
    }
    R.trace = trace.join(',').slice(0, 200);
    await act('session-finish-btn', 400); await act('confirm-ok', 500);
    R.screen = document.querySelector('#session-screen')?.className + '|' + (!!$('plog-save-btn'));
    document.querySelector('[data-feel="great"]')?.click(); await w(100);
    R.hint = $('plog-done-hint')?.textContent;
    $('plog-save-btn')?.click(); await w(1500);
    const sessions = await userDoc().collection('training_sessions').get();
    R.sessionDocs = sessions.size;
    const newDoc = sessions.docs.find(d => d.id !== 'old1' && d.id !== 'old2');
    const nd = newDoc && newDoc.data();
    R.newSession = nd ? { name: nd.sessionName, ex: nd.exercises.map(e => e.name + '|' + (e.exerciseId || '-') + '|sets' + e.target.sets + '|hechas' + e.sets.length), keys: Object.keys(nd.exercises[0]).join(','), load: nd.exercises[0].target.weight } : null;
    R.newSessionPlanLoadChanged = window.kruxActivePlan.sessions[2].exercises[0].weight;

    // ── Editar el plan antiguo y guardar
    window.openPlanEditor({ edit: true }); await w(700);
    R.editorOpened = $('pe-title').textContent + '|' + document.querySelectorAll('.pe-session-card').length;
    // sesión 3 (Resistencia) → editar «ARC» (primer ejercicio) a 3 series
    document.querySelectorAll('.pe-session-toggle')[2].click(); await w(150);
    const arcBtn = [...document.querySelectorAll('.pe-ex-open')].find(b => /ARC/.test(b.textContent));
    arcBtn.click(); await w(500);
    R.arcFields = [...document.querySelectorAll('#ex-editor-sheet .ex-field')].filter(f => f.offsetParent !== null).map(f => f.querySelector('label')?.textContent).join(',');
    $('ex-field-sets').value = 3; $('ex-field-sets').dispatchEvent(new Event('input')); $('ex-editor-save').click(); await w(300);
    // añadir un ejercicio de la biblioteca a «Piernas»
    document.querySelectorAll('.pe-session-toggle')[3].click(); await w(150);
    R.addBtns = document.querySelectorAll('.pe-add-ex-btn').length + '|' + document.querySelectorAll('.pe-session-toggle').length + '|' + !$('ex-editor-sheet').classList.contains('hidden');
    const addBtns = document.querySelectorAll('.pe-add-ex-btn'); addBtns[addBtns.length - 1].click(); await w(900);
    $('xl-search').value = 'zancada'; $('xl-search').dispatchEvent(new Event('input')); await w(400);
    document.querySelector('[data-add=zancadas]').click(); await w(200); $('xl-done').click(); await w(500);
    $('pe-save-top').click(); await w(1800);
    R.savedScreen = !!document.querySelector('.pe-saved-title') + '|' + document.querySelector('.pe-saved-note')?.textContent;
    $('pe-saved-done')?.click(); await w(400);

    const after = (await userDoc().collection('training_plan').doc('active').get()).data();
    R.fieldsKept = after.sessions.map((s, si) => s.exercises.every((e, ei) => {
      const o = legacy.sessions[si] && legacy.sessions[si].exercises[ei];
      if (!o) return true;                               // ejercicio nuevo
      return ['name', 'sets', 'workSec', 'reps', 'weight', 'restSec', 'rpeTarget'].every(k => (si === 2 && ei === 0 && k === 'sets') || e[k] === o[k] || (si === 2 && k === 'weight'));
    })).join(',');
    R.links = after.sessions.flatMap(s => s.exercises).map(e => e.name.slice(0, 18) + '=' + (e.exerciseId || '-')).join(' ; ');
    R.arcSets = after.sessions[2].exercises[0].sets + '|' + after.sessions[2].exercises[0].workSec;
    R.newEx = JSON.stringify(after.sessions[3].exercises);
    R.noUndefinedKeys = !JSON.stringify(after).includes('undefined');

    // ── El historial no cambia al editar el plan
    await signCycle();
    const histAfter = await userDoc().collection('training_sessions').get().then(s => s.docs.map(d => [d.id, JSON.stringify(d.data(), (k, v) => (v && v.seconds !== undefined ? 'TS' : v))]).sort());
    const beforeMap = new Map(histBefore); R.historyUnchanged = histBefore.every(([id, js]) => histAfter.some(([i2, j2]) => i2 === id && j2 === js));
    const rec = (window.kruxTrainLog || []).find(r => r.id === (newDoc && newDoc.id));
    R.recordAfterEdit = rec ? rec.exercises[0].target.sets + '|' + rec.exercises[0].name : 'sin registro';
    R.planAfterReload = window.kruxActivePlan.sessions[2].exercises[0].sets;
    // ── Sesión con ejercicios ya enlazados: el historial guarda exerciseId y versión
    switchView('train-view'); await w(500);
    window.__s = 1; openActiveSession(); await w(700);
    const act2 = async (id, ms) => { const el = $(id); if (el && !el.disabled && el.offsetParent !== null) { el.click(); await w(ms || 250); return true; } return false; };
    for (let i = 0; i < 20; i++) {
      if (await act2('session-btn-set', 300)) { document.querySelector('#session-rpe-dots [data-rpe="7"]')?.click(); await w(200); continue; }
      if (await act2('session-btn-main', 400)) continue;
      break;
    }
    await act2('session-finish-btn', 400); await act2('confirm-ok', 500);
    document.querySelector('[data-feel="ok"]')?.click(); await w(100);
    $('plog-save-btn')?.click(); await w(1500);
    const all2 = await userDoc().collection('training_sessions').get();
    const linkedDoc = all2.docs.filter(d => d.id !== 'old1' && d.id !== 'old2' && d.id !== (newDoc && newDoc.id))[0];
    R.linkedSession = linkedDoc ? linkedDoc.data().exercises.map(e => e.name.slice(0, 12) + '|' + e.exerciseId + '|v' + e.exerciseContentVersion + '|sets' + e.target.sets).join(' ; ') + ' || ' + (linkedDoc.data().feel || '-') : 'sin documento';
    R.metaKept = JSON.stringify([window.kruxActivePlan.goal, window.kruxActivePlan.level, window.kruxActivePlan.equipment]) + '|doc=' + JSON.stringify([after.goal, after.level, after.equipment]);
  } catch (e) { R.err = e.message + ' ' + (e.stack || '').split('\n')[1]; }
  done();
})();
</script>
